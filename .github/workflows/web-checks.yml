name: web-checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-database:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm platform:test test/agent-analytics-contract.test.mjs test/agent-analytics-store.test.mjs
