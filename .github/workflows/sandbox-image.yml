name: sandbox-image

# Explicit CI-only baseline selection. Outputs must be reviewed and the exact
# generated locks committed before the launcher can accept a production image.
on:
  push:
    branches: [feat/tenant-science-isolation]
    paths:
      - runtime/opencode-patches/**
      - runtime/codex-patches/**
      - scripts/dev/build-codex-guard-runtime.mjs
      - scripts/dev/build-opencode-title-runtime.mjs
      - runtime/sandbox/**
      - scripts/dev/probe-production-runner.mjs
      - crates/osd-cli/**
      - crates/osd-core/**
      - scripts/dev/fetch-sandbox-codex.mjs
      - scripts/dev/prepare-science-image.mjs
      - scripts/dev/stage-sandbox-image.mjs
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:
    inputs:
      native_feasibility_only:
        description: Run only the isolated pinned native capability gate without producing a release image
        required: false
        type: boolean
        default: false
      python_image:
        description: Exact Python 3.12 image tag or digest to select
        required: true
        default: python:3.12.12-slim-bookworm
      uv_image:
        description: Image for the repository-pinned uv version
        required: true
        default: ghcr.io/astral-sh/uv:0.11.26

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-feasibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: pnpm/action-setup@v4
      - name: Check out the exact native integration source without credentials
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 36650394c5b38c2990ccf2a3457165ca3e9d9726
          path: .deploy/codex-source
          persist-credentials: false
      - name: Stage the integrity-pinned native binary and private synthetic fixtures
        run: |
          node scripts/dev/fetch-sandbox-codex.mjs
          cp "$(command -v node)" .deploy/science-context/tools/bin/node
          node services/platform/fixtures/native-protocol.mjs --prepare
          chmod 777 .deploy/native-capabilities/output
          docker pull python:3.12.12-slim-bookworm
          docker image inspect --format '{{index .RepoDigests 0}}' python:3.12.12-slim-bookworm > .deploy/native-capabilities/output/container-image.txt
      # Cache only exact pinned compilation inputs, never a fixture's pass result.
      # RED/GREEN, cargo build and binary measurement run even after a cache hit.
      - name: Restore exact native compilation cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .deploy/codex-source/codex-rs/target
          key: codex-36650394c5b38c2990ccf2a3457165ca3e9d9726-rust1.95.0-x86_64-unknown-linux-gnu-ubuntu22.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/codex-patches/**', 'scripts/dev/build-codex-guard-runtime.mjs', 'pnpm-lock.yaml') }}
      - name: Build only the pinned Web guard integration on dedicated CI
        id: native-build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcap-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal
          pnpm install --frozen-lockfile --ignore-scripts --filter @ai4s/platform...
          pnpm runtime:codex:build
      - name: Save exact compilation cache before capability acceptance
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .deploy/codex-source/codex-rs/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify real pre-effect guards and file bytes without host credentials or egress
        run: |
          # Match backend.rs: zero capabilities/no-new-privileges and no outer
          # seccomp/AppArmor profile. Native workspace-write isolation remains on.
          timeout --signal=TERM --kill-after=10s 180s docker run --rm --name scikeel-native-capability-test \
            --network=none --read-only --user 1000:1000 --memory=768m --memory-swap=896m --pids-limit=128 --cpus=1 \
            --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /fixture/native:rw,nosuid,nodev,uid=1000,gid=1000,size=128m \
            -v "$PWD:/fixture/repo:ro" \
            -v "$PWD/.deploy/science-context/tools/bin:/opt/scikeel/tools/bin:ro" \
            -v "$PWD/services/platform/fixtures/native-protocol.mjs:/opt/scikeel/runtime/required-effect-guard.mjs:ro" \
            -v "$PWD/.deploy/native-capabilities/config/requirements.toml:/etc/codex/requirements.toml:ro" \
            -v "$PWD/.deploy/native-capabilities/config:/fixture/config:ro" \
            -v "$PWD/.deploy/native-capabilities/output:/fixture/output:rw" \
            -e CI=true -e SCIKEEL_NATIVE_CAPABILITY_CONTAINER=1 -e GITHUB_SHA="$GITHUB_SHA" \
            --entrypoint /opt/scikeel/tools/bin/node "$(cat .deploy/native-capabilities/output/container-image.txt)" \
            /fixture/repo/scripts/dev/probe-production-runner.mjs --native-capabilities
      - name: Install the exact production gVisor release for nested sandbox acceptance
        run: |
          mkdir -p .deploy/gvisor .deploy/native-gvisor-capabilities/output
          curl --fail --location --retry 3 --output .deploy/gvisor/archive.tar.zstd https://storage.googleapis.com/gvisor/releases/release/20260928.0/x86_64/gvisor.tar.zstd
          echo '4ce35ca83aef7f96b06cde668e0b23aa98b05aa1829508e974196c2a1e02786c95f5bf79315fd7ddcfd88fe7a00f083ed8053e25eff7673d28d5256440caae8b  .deploy/gvisor/archive.tar.zstd' | sha512sum --check
          tar --zstd -xf .deploy/gvisor/archive.tar.zstd -C .deploy/gvisor
          sudo install -d -m 0755 /usr/local/lib/scikeel-gvisor/gvisor-bin
          sudo install -m 0755 .deploy/gvisor/runsc /usr/local/lib/scikeel-gvisor/runsc
          sudo install -m 0755 .deploy/gvisor/gvisor-bin/* /usr/local/lib/scikeel-gvisor/gvisor-bin/
          for helper in /usr/local/lib/scikeel-gvisor/runsc /usr/local/lib/scikeel-gvisor/gvisor-bin/*; do
            sudo -u nobody test -x "$helper"
          done
          test "$(/usr/local/lib/scikeel-gvisor/runsc --version | head -n 1)" = 'runsc version release-20260928.0'
          sha256sum /usr/local/lib/scikeel-gvisor/runsc > .deploy/native-gvisor-capabilities/output/runsc.sha256
          sudo /usr/local/lib/scikeel-gvisor/runsc install --runtime=scikeel-gvisor -- --platform=systrap --network=sandbox --host-uds=none --directfs=false
          sudo systemctl restart docker
          chmod 777 .deploy/native-gvisor-capabilities/output
      - name: Verify the same real writes, guard denials, isolation and Stop in gVisor
        run: |
          timeout --signal=TERM --kill-after=10s 300s docker run --rm --name scikeel-native-gvisor-test --runtime=scikeel-gvisor \
            --network=none --read-only --user 1000:1000 --memory=768m --memory-swap=896m --pids-limit=128 --cpus=1 \
            --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /fixture/native:rw,nosuid,nodev,uid=1000,gid=1000,size=128m \
            -v "$PWD:/fixture/repo:ro" \
            -v "$PWD/.deploy/science-context/tools/bin:/opt/scikeel/tools/bin:ro" \
            -v "$PWD/services/platform/fixtures/native-protocol.mjs:/opt/scikeel/runtime/required-effect-guard.mjs:ro" \
            -v "$PWD/.deploy/native-capabilities/config/requirements.toml:/etc/codex/requirements.toml:ro" \
            -v "$PWD/.deploy/native-capabilities/config:/fixture/config:ro" \
            -v "$PWD/.deploy/native-gvisor-capabilities/output:/fixture/output:rw" \
            -e CI=true -e SCIKEEL_NATIVE_CAPABILITY_CONTAINER=1 -e GITHUB_SHA="$GITHUB_SHA" \
            --entrypoint /opt/scikeel/tools/bin/node "$(cat .deploy/native-capabilities/output/container-image.txt)" \
            /fixture/repo/scripts/dev/probe-production-runner.mjs --native-capabilities
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gvisor-capabilities-${{ github.sha }}
          path: .deploy/native-gvisor-capabilities/output/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-capabilities-${{ github.sha }}
          path: .deploy/native-capabilities/output/
          retention-days: 14
      - name: Preserve the successful same-source native build for the production image
        uses: actions/upload-artifact@v4
        with:
          name: guarded-codex-${{ github.sha }}
          path: |
            .deploy/science-context/tools/bin/codex
            .deploy/science-context/tools/bin/codex-resources/bwrap
            .deploy/science-context/tools/bin/native-integration.json
          compression-level: 0
          retention-days: 14
      - name: Clean up the disposable native fixture
        if: always()
        run: docker rm -f scikeel-native-capability-test scikeel-native-gvisor-test 2>/dev/null || true
  science-probe-image:
    needs: native-feasibility
    if: ${{ !inputs.native_feasibility_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      SCIKEEL_IMAGE_VARIANT: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked platform dependencies for image validators
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @ai4s/platform...
      - name: Consume only the successful guarded binary from this workflow source
        uses: actions/download-artifact@v4
        with:
          name: guarded-codex-${{ github.sha }}
          path: .deploy/guarded-codex
      - name: Compose the measured native build resources
        run: |
          mkdir -p .deploy/science-context/tools/bin/codex-resources
          cp .deploy/guarded-codex/codex .deploy/science-context/tools/bin/codex
          cp .deploy/guarded-codex/native-integration.json .deploy/science-context/tools/bin/native-integration.json
          cp .deploy/guarded-codex/codex-resources/bwrap .deploy/science-context/tools/bin/codex-resources/bwrap
          chmod 755 .deploy/science-context/tools/bin/codex .deploy/science-context/tools/bin/codex-resources/bwrap
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare and verify the managed OpenCode source patch
        shell: bash
        env:
          SCIKEEL_RUNTIME_BUN: bun
        run: |
          mkdir -p .superpowers/sdd/2026-10-06-session-title-model
          git clone --filter=blob:none --no-checkout https://github.com/anomalyco/opencode.git .superpowers/sdd/2026-10-06-session-title-model/source-git
          git -C .superpowers/sdd/2026-10-06-session-title-model/source-git checkout 545f51d26cc39a907d2867492d498d9607ea5fa4
          pnpm runtime:title:prepare
          pnpm runtime:title:check
          pnpm runtime:title:test
          pnpm runtime:title:build
          sudo ip address add 172.31.240.1/32 dev lo
          trap 'sudo ip address del 172.31.240.1/32 dev lo' EXIT
          OSD_SESSION_TITLE_BINARY="$PWD/.deploy/session-title-runtime/opencode" OSD_SESSION_TITLE_DEPENDENCIES="$PWD/.superpowers/sdd/2026-10-06-session-title-model/source-git/packages/opencode/node_modules" pnpm platform:test ../../runtime/opencode-patches/session-title-native.acceptance.mjs ../../runtime/opencode-patches/network-native.acceptance.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the headless core in a verified bounded scope
        shell: bash
        run: |
          mkdir -p .deploy
          flock -n .deploy/web-release-deploy.lock flock -n .deploy/desktop-task.lock \
            sudo systemd-run --scope -p MemoryHigh=1850M -p MemoryMax=2200M -p MemorySwapMax=256M \
            sudo -u "$USER" env PATH="$PATH" OSD_TASK_FORCE_LIMITS=1 CARGO_BUILD_JOBS=1 CARGO_PROFILE_DEV_DEBUG=0 \
            node scripts/dev/safe-desktop-task.mjs core-build --guarded --package osd-cli
      - name: Resolve exact source image digests
        env:
          PYTHON_SOURCE: ${{ inputs.python_image || 'python:3.12.12-slim-bookworm' }}
          UV_SOURCE: ${{ inputs.uv_image || 'ghcr.io/astral-sh/uv:0.11.26' }}
        shell: bash
        run: |
          node --input-type=module -e 'for (const key of ["PYTHON_SOURCE","UV_SOURCE"]) { const value=process.env[key]; if (!/^[a-zA-Z0-9._/:@-]+$/.test(value) || value.endsWith(":latest")) process.exit(1); }'
          mkdir -p .deploy/science-context/tools/bin .deploy/science-artifacts
          docker pull "$PYTHON_SOURCE"
          docker pull "$UV_SOURCE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$PYTHON_SOURCE" > .deploy/science-artifacts/python-image.txt
          docker image inspect --format '{{index .RepoDigests 0}}' "$UV_SOURCE" > .deploy/science-artifacts/uv-image.txt
          cp runtime/sandbox/image/{Dockerfile,pyproject.toml,uv.lock} .deploy/science-context/
          cp target/debug/osd .deploy/science-context/tools/bin/
          cp "$(command -v node)" .deploy/science-context/tools/bin/
          cp .deploy/session-title-runtime/opencode .deploy/science-context/tools/bin/opencode
          cp .deploy/session-title-runtime/runtime-manifest.json .deploy/science-context/tools/session-title-runtime.json
          cp runtime/sandbox/{runner,file-rpc,cli-jobs,science-environment,collaboration,tool-outcome,native-tools,required-effect-guard,native-network}.mjs .deploy/science-context/tools/
          cp runtime/sandbox/native-network.py .deploy/science-context/tools/
          cp runtime/sandbox/codex-requirements.toml .deploy/science-context/tools/
          cp runtime/sandbox/project-environment.py .deploy/science-context/tools/
          mkdir -p .deploy/science-context/tools/resources/skills-core
          tar -C runtime/skills/core --exclude=.gitkeep -cf - . | tar -C .deploy/science-context/tools/resources/skills-core -xf -
      - name: Resolve scientific dependencies on the dedicated CI host
        shell: bash
        run: |
          PYTHON_IMAGE=$(cat .deploy/science-artifacts/python-image.txt)
          UV_IMAGE=$(cat .deploy/science-artifacts/uv-image.txt)
          docker create --name scikeel-uv "$UV_IMAGE"
          docker cp scikeel-uv:/uv .deploy/science-context/tools/bin/uv
          docker rm scikeel-uv
          docker run --rm --memory=512m --memory-swap=640m --pids-limit=128 --cpus=1 \
            -v "$PWD/.deploy/science-context:/baseline" -w /baseline \
            -e UV_PYTHON_DOWNLOADS=never "$PYTHON_IMAGE" /baseline/tools/bin/uv lock --locked --python /usr/local/bin/python3.12
          cp .deploy/science-context/uv.lock .deploy/science-artifacts/
          node scripts/dev/prepare-science-image.mjs .deploy/science-context .deploy/science-artifacts
      - name: Build with bounded dedicated BuildKit resources
        shell: bash
        run: |
          docker buildx create --name scikeel-science-builder --driver docker-container \
            --driver-opt memory=2g,memory-swap=2304m --use
          docker buildx build --load --tag scikeel-science-probe:ci \
            --build-arg "PYTHON_IMAGE=$(cat .deploy/science-artifacts/python-image.txt)" \
            --build-arg "UV_IMAGE=$(cat .deploy/science-artifacts/uv-image.txt)" .deploy/science-context
      - name: Verify offline imports and immutable baseline
        shell: bash
        run: |
          mkdir -p .deploy/science-workspace .deploy/science-test
          chmod 777 .deploy/science-workspace
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(".deploy/science-test/case.json", JSON.stringify({schema:1,synthetic:true,case:"science-image"}));'
          cp runtime/sandbox/probe-entry.mjs .deploy/science-test/probe-entry.mjs
          sudo chown root:root .deploy/science-test/case.json
          docker run --rm --network=none --read-only --memory=640m --memory-swap=768m --pids-limit=256 --cpus=1 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -v "$PWD/.deploy/science-workspace:/workspace" \
            -v "$PWD/.deploy/science-test:/opt/scikeel/test:ro" \
            --entrypoint /opt/scikeel/tools/bin/node scikeel-science-probe:ci \
            /opt/scikeel/test/probe-entry.mjs /opt/scikeel/test/case.json
      - name: Verify actual native effects and isolation in the final production image under gVisor
        shell: bash
        run: |
          mkdir -p .deploy/gvisor .deploy/production-native-capabilities/output
          curl --fail --location --retry 3 --output .deploy/gvisor/archive.tar.zstd https://storage.googleapis.com/gvisor/releases/release/20260928.0/x86_64/gvisor.tar.zstd
          echo '4ce35ca83aef7f96b06cde668e0b23aa98b05aa1829508e974196c2a1e02786c95f5bf79315fd7ddcfd88fe7a00f083ed8053e25eff7673d28d5256440caae8b  .deploy/gvisor/archive.tar.zstd' | sha512sum --check
          tar --zstd -xf .deploy/gvisor/archive.tar.zstd -C .deploy/gvisor
          sudo install -d -m 0755 /usr/local/lib/scikeel-gvisor/gvisor-bin
          sudo install -m 0755 .deploy/gvisor/runsc /usr/local/lib/scikeel-gvisor/runsc
          sudo install -m 0755 .deploy/gvisor/gvisor-bin/* /usr/local/lib/scikeel-gvisor/gvisor-bin/
          for helper in /usr/local/lib/scikeel-gvisor/runsc /usr/local/lib/scikeel-gvisor/gvisor-bin/*; do
            sudo -u nobody test -x "$helper"
          done
          test "$(/usr/local/lib/scikeel-gvisor/runsc --version | head -n 1)" = 'runsc version release-20260928.0'
          sha256sum /usr/local/lib/scikeel-gvisor/runsc > .deploy/production-native-capabilities/output/runsc.sha256
          sudo /usr/local/lib/scikeel-gvisor/runsc install --runtime=scikeel-gvisor -- --platform=systrap --network=sandbox --host-uds=none --directfs=false
          sudo systemctl restart docker
          node services/platform/fixtures/native-protocol.mjs --prepare
          chmod 777 .deploy/production-native-capabilities/output
          timeout --signal=TERM --kill-after=10s 300s docker run --rm --name scikeel-production-native-test --runtime=scikeel-gvisor \
            --network=none --read-only --user 1000:1000 --memory=768m --memory-swap=896m --pids-limit=128 --cpus=1 \
            --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --tmpfs /fixture/native:rw,nosuid,nodev,uid=1000,gid=1000,size=128m \
            -v "$PWD:/fixture/repo:ro" \
            -v "$PWD/services/platform/fixtures/native-protocol.mjs:/opt/scikeel/runtime/required-effect-guard.mjs:ro" \
            -v "$PWD/.deploy/native-capabilities/config:/fixture/config:ro" \
            -v "$PWD/.deploy/production-native-capabilities/output:/fixture/output:rw" \
            -e CI=true -e SCIKEEL_NATIVE_CAPABILITY_CONTAINER=1 -e GITHUB_SHA="$GITHUB_SHA" \
            --entrypoint /opt/scikeel/tools/bin/node scikeel-science-probe:ci \
            /fixture/repo/scripts/dev/probe-production-runner.mjs --native-capabilities
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-native-gvisor-capabilities-${{ github.sha }}
          path: .deploy/production-native-capabilities/output/
          retention-days: 14
      - name: Verify the real production runner, gateway and authenticated file helper
        shell: bash
        run: |
          mkdir -p .deploy/runner-fixture/{workspace,state,home,codex-home,scratch,config}
          chmod 777 .deploy/runner-fixture/{workspace,state,home,codex-home,scratch}
          sudo chown 1000:1000 .deploy/runner-fixture/{workspace,state,home,codex-home,scratch}
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; const dir=".deploy/runner-fixture/config/"; writeFileSync(dir+"tenant.json",JSON.stringify({schema:1,instanceId:"sandbox-test-ci",generation:1,workspaceDir:"/fixture/workspace",stateDir:"/fixture/state",home:"/fixture/home",scratchDir:"/fixture/scratch"})); writeFileSync(dir+"runner-auth.json",JSON.stringify({schema:1,token:"a".repeat(64)}));'
          sudo chown root:root .deploy/runner-fixture/config/*.json
          cp scripts/dev/probe-production-runner.mjs .deploy/science-test/
          timeout --signal=TERM --kill-after=10s 70s docker run --rm --name scikeel-production-runner-test \
            --network=none --read-only --memory=1024m --memory-swap=1152m --pids-limit=256 --cpus=1 \
            --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -v "$PWD/.deploy/runner-fixture/workspace:/fixture/workspace" \
            -v "$PWD/.deploy/runner-fixture/state:/fixture/state" \
            -v "$PWD/.deploy/runner-fixture/home:/fixture/home" \
            -v "$PWD/.deploy/runner-fixture/codex-home:/fixture/codex-home" \
            -v "$PWD/.deploy/runner-fixture/scratch:/fixture/scratch" \
            -v "$PWD/.deploy/runner-fixture/config/tenant.json:/opt/scikeel/tenant.json:ro" \
            -v "$PWD/.deploy/runner-fixture/config/runner-auth.json:/opt/scikeel/runner-auth.json:ro" \
            -v "$PWD/.deploy/science-test:/opt/scikeel/test:ro" \
            --entrypoint /opt/scikeel/tools/bin/node scikeel-science-probe:ci \
            /opt/scikeel/test/probe-production-runner.mjs
      - name: Verify a real unanswered checkpoint in the pinned runtime
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 120s docker run --rm \
            --network=none --read-only --memory=1024m --memory-swap=1152m --pids-limit=256 --cpus=1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD:/fixture/repo:ro" \
            -e OSD_COLLABORATION_BINARY=/opt/scikeel/tools/bin/opencode \
            -w /fixture/repo/services/platform \
            --entrypoint /opt/scikeel/tools/bin/node scikeel-science-probe:ci \
            --test --test-concurrency=1 /fixture/repo/services/platform/test/collaboration-opencode.test.mjs
      - name: Export immutable artifact and measured identities
        shell: bash
        run: |
          docker create --name scikeel-science-export scikeel-science-probe:ci
          docker export scikeel-science-export | gzip -n > .deploy/science-artifacts/rootfs.tar.gz
          docker rm scikeel-science-export
          node scripts/dev/prepare-science-image.mjs .deploy/science-context .deploy/science-artifacts --manifest
      - uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-path: |
            .deploy/science-artifacts/rootfs.tar.gz
            .deploy/science-artifacts/image-manifest.json
      - name: Save the signed attestation bundle with the artifacts
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: cp "$ATTESTATION_BUNDLE" .deploy/science-artifacts/attestation.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: science-v1-production-${{ github.sha }}
          path: .deploy/science-artifacts/
          retention-days: 14
      - name: Clean up dedicated CI containers
        if: always()
        shell: bash
        run: |
          docker rm -f scikeel-uv scikeel-science-export scikeel-production-runner-test 2>/dev/null || true
          docker buildx rm scikeel-science-builder 2>/dev/null || true
