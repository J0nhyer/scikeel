# Cargo workspace root.
#
# Three crates serve the Web workbench and the headless `osd` command:
#
#   crates/osd-core  — the server: workspace paths, the OpenCode sidecar, the
#                      opencode config, projects/runs, and the HTTP gateway.
#   crates/osd-cli   — `osd`: the same server without a window, plus a client
#                      for it and for a running gateway.
#   crates/osd-sandbox-host — the sandbox host layer.
#
# The retired Tauri desktop shell is not a workspace member. The server has no
# GUI dependency, so it runs on a compute node with no display.
[workspace]
resolver = "2"
members = ["crates/osd-core", "crates/osd-cli", "crates/osd-sandbox-host"]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
osd-core = { path = "crates/osd-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "native-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.4.3"
